name: Build Biomech AI APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Decode keystore
        run: |
          echo "${{ secrets.BIOMECH_KEYSTORE_B64 }}" | base64 --decode > biomech_ai/android/biomech_ai.keystore

      - name: Download Gradle Wrapper JAR
        run: |
          JAR="biomech_ai/android/gradle/wrapper/gradle-wrapper.jar"
          SIZE=$(wc -c < "$JAR" 2>/dev/null || echo 0)
          if [ "$SIZE" -lt 50000 ]; then
            echo "JAR missing or too small ($SIZE bytes), downloading from GitHub..."
            curl -fsSL \
              "https://raw.githubusercontent.com/gradle/gradle/v9.3.1/gradle/wrapper/gradle-wrapper.jar" \
              -o "$JAR" || \
            curl -fsSL \
              "https://raw.githubusercontent.com/gradle/gradle/REL_9.3.1/gradle/wrapper/gradle-wrapper.jar" \
              -o "$JAR" || \
            (echo "Trying from v9.0..." && curl -fsSL \
              "https://raw.githubusercontent.com/gradle/gradle/v9.0.0/gradle/wrapper/gradle-wrapper.jar" \
              -o "$JAR")
          fi
          ls -lh "$JAR"

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > biomech_ai/android/local.properties
          echo "flutter.sdk=$(dirname $(dirname $(which flutter)))" >> biomech_ai/android/local.properties
          cat biomech_ai/android/local.properties

      - name: Install dependencies
        working-directory: biomech_ai
        run: flutter pub get

      - name: Build APK
        working-directory: biomech_ai
        env:
          KEY_ALIAS: ${{ secrets.BIOMECH_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BIOMECH_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.BIOMECH_STORE_PASSWORD }}
        run: flutter build apk --release --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BiomechAI-release
          path: biomech_ai/build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Biomech AI v0.1.${{ github.run_number }}
          files: biomech_ai/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
